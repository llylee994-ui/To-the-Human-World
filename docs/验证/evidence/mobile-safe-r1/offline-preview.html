let chosen='shop';function draw(selected=chosen){chosen=selected;const candidates=frames.filter(f=>f.selected===chosen);const f=candidates.reduce((a,b)=>Math.abs(b.width-innerWidth)+Math.abs(b.height-innerHeight)<Math.abs(a.width-innerWidth)+Math.abs(a.height-innerHeight)?b:a);stage.style.width=f.width/f.scale+'px';stage.style.height=f.height/f.scale+'px';stage.style.transform=`scale(${f.scale})`;stage.replaceChildren(render(f.tree));}

 img('image/misty-harbor-r1/sea-calm.png',x,y,aw,ah);

 return host;
