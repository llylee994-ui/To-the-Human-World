": "rating_pa_01", "bottleType": "normal", "body": "我叫埃利亚斯·沃德，在灰港码头搬了十几年货。我和在面包坊帮工的妹妹合住铁锚巷，靠两份工钱付房租和饭钱。\n\n这阵子实在很累，脑子里像塞了团湿棉花，沉得抬不起头。白天站在码头边，明明{{困}}得眼皮直打架，{{合上眼}}又全是杂乱的动静：浪头撞在栈桥上的响声、绳索绷紧的吱呀声，还有同伴喊数字的粗嗓门。今天扛箱子走到斜坡上，腿一软差点把货砸了。隔壁的汉克伸手{{帮忙}}顶了一把，还以为是我肩膀的旧伤又发作，问我是不是该歇歇。我{{没好意思}}跟他说，我是因为困得{{神志不清}}，连脚下有块水渍都没瞧见，只能顺着他的话含糊应了一声。要是因为箱子搬不稳，工头少{{算}}我几铜板就不好了。\n\n妹妹在面包坊帮工，每天天不亮就走，晚上回来时身上带着一股甜面粉的焦香味。她总把没人要的面包边带回来吃。我知道她想省下钱买新鞋，她那双鞋底都磨透了，一下雨就往里渗水。昨晚我俩围着火炉烤脚，她把鞋垫抽出来贴在铁罩子上，刺啦一声冒出一股水汽，她自己反倒先{{乐了}}。我也想笑，可笑完又觉得心酸。要是我这阵子能多搬几趟重货，早就够给她换双像样的麂皮鞋了。\n\n昨晚迷迷糊糊{{梦见}}母亲了。她还是坐在旧桌子旁，就着油灯缝我那件破棉袄，嘴里轻声哼着小时候哄我睡觉的歌调子，针脚又密又齐。梦里我靠在她腿边，听着哼唱声和灯芯偶尔劈啪的那一声，心里特别踏实，真想就这么一直睡下去，永远别醒。可睁开眼，屋里只有冷冰冰的墙，还有墙缝里渗进来的海风。我也想把这些旧事都{{忘记}}，省得醒来心里空落落的，可真要是连这样的梦都没了，又舍不得。\n\n我只希望哪天能安安静静地过一晚上，让我踏踏实实睡觉，第二天起来还有力气干活。\n\n埃利亚斯·沃德\n\n灰港铁锚巷12号 二楼", "cutWordIds": ["word_candidate_elias_sleep_alt", "word_candidate_elias_sleep", "word_candidate_elias_trust", "word_candidate_elias_fear", "word_candidate_e01_c1", "word_candidate_elias_reason", "word_candidate_elias_happy", "word_candidate_elias_dream", "word_candidate_elias_forget"], "requirement": {"desc": "埃利亚斯睡好一晚，次晨能工作", "conditions": {}, "tags": {"sleep": 0.8}, "forbiddenEffects": {}}, "kind": "order", "selfIntro": "来信人：埃利亚斯·沃德", "reward": {"currency": 100}, "senderId": "npc_passerby_a", "directRuleSetId": "rules_pa_01", "attachments": {}}, "view": {"spans": [{"spanId": "body:1", "kind": "word", "canCut": false, "text": "困", "wordId": "word_candidate_elias_sleep_alt", "cut": true}, {"spanId": "body:2", "kind": "word", "canCut": true, "text": "合上眼", "wordId": "word_candidate_elias_sleep", "cut": false}, {"spanId": "body:3", "kind": "word", "canCut": true, "text": "帮忙", "wordId": "word_candidate_elias_trust", "cut": false}, {"spanId": "body:4", "kind": "word", "canCut": true, "text": "没好意思", "wordId": "word_candidate_elias_fear", "cut": false}, {"spanId": "body:5", "kind": "word", "canCut": true, "text": "神志不清", "wordId": "word_candidate_e01_c1", "cut": false}, {"spanId": "body:6", "kind": "wor Id": false, "h": 37.2, "cut": false, "y": 595.2, "text": "母亲了。她还是坐在旧桌子旁，就着油灯缝我那件破棉袄，嘴里轻声", "w": 720.0, "x": 198.0}, {"spanId": false, "h": 37.2, "cut": false, "y": 632.4000000000001, "text": "哼着小时候哄我睡觉的歌调子，针脚又密又齐。梦里我靠在她腿边，听着哼唱声和灯芯", "w": 912.0, "x": 0}, {"spanId": false, "h": 37.2, "cut": false, "y": 669.6000000000001, "text": "偶尔劈啪的那一声，心里特别踏实，真想就这么一直睡下去，永远别醒。可睁开眼，屋", "w": 912.0, "x": 0}, {"spanId": false, "h": 37.2, "cut": false, "y": 706.8000000000002, "text": "里只有冷冰冰的墙，还有墙缝里渗进来的海风。我也想把这些旧事都", "w": 720.0, "x": 0}, {"spanId": "body:9", "h": 37.2, "cut": false, "y": 706.8000000000002, "text": "忘记", "w": 54.0, "x": 720.0}, {"spanId": false, "h": 37.2, "cut": false, "y": 706.8000000000002, "text": "，省得醒来心", "w": 144.0, "x": 774.0}, {"spanId": false, "h": 37.2, "cut": false, "y": 744.0000000000002, "text": "里空落落的，可真要是连这样的梦都没了，又舍不得。", "w": 576.0, "x": 0}, {"spanId": false, "h": 37.2, "cut": false, "y": 818.4000000000003, "text": "我只希望哪天能安安静静地过一晚上，让我踏踏实实睡觉，第二天起来还有力气干活。", "w": 912.0, "x": 0}, {"spanId": false, "h": 37.2, "cut": false, "y": 892.8000000000004, "text": "埃利亚斯·沃德", "w": 152.0, "x": 0}, {"spanId": false, "h": 37.2, "cut": false, "y": 967.2000000000005, "text": "灰港铁锚巷12号 二楼", "w": 228.0, "x": 0}], "height": 1004.4000000000005}, "frame": {"y": 15.299999999999999, "h": 479.4, "w": 1048.8, "x": 45.6}, "clip": {"y": 97.3, "h": 329.4, "w": 984.8, "x": 77.6}, "paper": {"y": 207.3, "h": 1012.4000000000005, "w": 942.8, "x": 95.6}, "holes": [{"y": 324.90000000000003, "h": 32.2, "w": 30.0, "x": 963.6}], "pose": {"spanId": "body:1", "phase": "snip", "w": 30.0, "x": 963.6, "scale": 1.0, "snip": 0.5625, "angle": -0.0, "opacity": 1, "text": "困", "h": 37.2, "y": 322.90000000000003}, "fontSize": 24.0, "lineHeight": 37.2}, {"width": 1140, "height": 510, "label": "flight", "definition": {"title": "铁锚巷的一夜", "id": "letter_pa_01", "cuttable": true, "appearCondition": {"dayMin": 1}, "address": "灰港铁锚巷12号 二楼", "followupTemplateId": "tpl_pa_01", "ratingSetId": "rating_pa_01", "bottleType": "normal", "body": "我叫埃利亚斯·沃德，在灰港码头搬了十几年货。我和在面包坊帮工的妹妹合住铁锚巷，靠两份工钱付房租和饭钱。\n\n这阵子实在很累，脑子里像塞了团湿棉花，沉得抬不起头。白天站在码头边，明明{{困}}得眼皮直打架，{{合上眼}}又全是杂乱的动静：浪头撞在栈桥上的响声、绳索绷紧的吱呀声，还有同伴喊数字的粗嗓门。今天扛箱子走到斜坡上，腿一软差点把货砸了。隔壁的汉克伸手{{帮忙}}顶了一把，还以为是我肩膀的旧伤又发作，问我是不是该歇歇。我{{没好意思}}跟他说，我是因为困得{{神志不清}}，连脚下有块水渍都没瞧见，只能顺着他的话含糊应了一声。要是因为箱子搬不稳，工头少{{算}}我几铜板就不好了。\n\n妹妹在面包坊帮工，每天天不亮就走，晚上回来时身上带着一股甜面粉的焦香味。她总把没人要的面包边带回来吃。我知道她想省下钱买新鞋，她那双鞋底都磨透了，一下雨就往里渗水。昨晚我俩围着火炉烤脚，她把鞋垫抽出来贴在铁罩子上，刺啦一声冒出一股水汽，她自己反倒先{{乐了}}。我也想笑，可笑完又觉得心酸。要是我这阵子能多搬几趟重货，早就够给她换双像样的麂皮鞋了。\n\n昨晚迷迷糊糊{{梦见}}母亲了。她还是坐在旧桌子旁，就着油灯缝我那件破棉袄，嘴里轻声哼着小时候哄我睡觉的歌调子，针脚又密又齐。梦里我靠在她腿边，听着哼唱声和灯芯偶尔劈啪的那一声，心里特别踏实，真想就这么一直睡下去，永远别醒。可睁开眼，屋里只有冷冰冰的墙，还有墙缝里渗进来的海风。我也想把这些旧事都{{忘记}}，省得醒来心里空落落的，可真要是连这样的梦都没了，又舍不得。\n\n我只希望哪天能安安静静地过一晚上，让我踏踏实实睡觉，第二天起来还有力气干活。\n\n埃利亚斯·沃德\n\n灰港铁锚巷12号 二楼", "cutWordIds": ["word_candidate_elias_sleep_alt", "word_candidate_elias_sleep", "word_candidate_elias_trust", "word_candidate_elias_fear", "word_candidate_e01_c1", "word_candidate_elias_reason", "word_candidate_elias_happy", "word_candidate_elias_dream", "word_candidate_elias_forget"], "requirement": {"desc": "埃利亚斯睡好一晚，次晨能工作", "conditions": {}, "tags": {"sleep": 0.8}, "forbiddenEffects": {}}, "kind": "order", "selfIntro": "来信人：埃利亚斯·沃德", "reward": {"currency": 100}, "senderId": "npc_passerby_a", "directRuleSetId": "rules_pa_01", "attachments": {}}, "view": {"spans": [{"spanId": "body:1", "kind": "word", "canCut": false, "text": "困", "wordId": "word_candidate_elias_sleep_alt", "cut": true}, {"spanId": "body:2", "kind": "word", "canCut": true, "text": "合上眼", "wordId": "word_candidate_elias_sleep", "cut": false}, {"spanId": "body:3", "kind": "word", "canCut": true, "text": "帮忙", "wordId": "word_candidate_elias_trust", "cut": false}, {"spanId": "body:4", "kind": "word", "canCut": true, "text": "没好意思", "wordId": "word_candidate_elias_fear", "cut": false}, {"spanId": "body:5", "kind": "word", "canCut": true, "text": "神志不清", "wordId": "word_candidate_e01_c1", "cut": false}, {"spanId": "body:6", "kind": "word", "canCut": true, "text": "  "bottleType": "normal", "body": "我叫埃利亚斯·沃德，在灰港码头搬了十几年货。我和在面包坊帮工的妹妹合住铁锚巷，靠两份工钱付房租和饭钱。\n\n这阵子实在很累，脑子里像塞了团湿棉花，沉得抬不起头。白天站在码头边，明明{{困}}得眼皮直打架，{{合上眼}}又全是杂乱的动静：浪头撞在栈桥上的响声、绳索绷紧的吱呀声，还有同伴喊数字的粗嗓门。今天扛箱子走到斜坡上，腿一软差点把货砸了。隔壁的汉克伸手{{帮忙}}顶了一把，还以为是我肩膀的旧伤又发作，问我是不是该歇歇。我{{没好意思}}跟他说，我是因为困得{{神志不清}}，连脚下有块水渍都没瞧见，只能顺着他的话含糊应了一声。要是因为箱子搬不稳，工头少{{算}}我几铜板就不好了。\n\n妹妹在面包坊帮工，每天天不亮就走，晚上回来时身上带着一股甜面粉的焦香味。她总把没人要的面包边带回来吃。我知道她想省下钱买新鞋，她那双鞋底都磨透了，一下雨就往里渗水。昨晚我俩围着火炉烤脚，她把鞋垫抽出来贴在铁罩子上，刺啦一声冒出一股水汽，她自己反倒先{{乐了}}。我也想笑，可笑完又觉得心酸。要是我这阵子能多搬几趟重货，早就够给她换双像样的麂皮鞋了。\n\n昨晚迷迷糊糊{{梦见}}母亲了。她还是坐在旧桌子旁，就着油灯缝我那件破棉袄，嘴里轻声哼着小时候哄我睡觉的歌调子，针脚又密又齐。梦里我靠在她腿边，听着哼唱声和灯芯偶尔劈啪的那一声，心里特别踏实，真想就这么一直睡下去，永远别醒。可睁开眼，屋里只有冷冰冰的墙，还有墙缝里渗进来的海风。我也想把这些旧事都{{忘记}}，省得醒来心里空落落的，可真要是连这样的梦都没了，又舍不得。\n\n我只希望哪天能安安静静地过一晚上，让我踏踏实实睡觉，第二天起来还有力气干活。\n\n埃利亚斯·沃德\n\n灰港铁锚巷12号 二楼", "cutWordIds": ["word_candidate_elias_sleep_alt", "word_candidate_elias_sleep", "word_candidate_elias_trust", "word_candidate_elias_fear", "word_candidate_e01_c1", "word_candidate_elias_reason", "word_candidate_elias_happy", "word_candidate_elias_dream", "word_candidate_elias_forget"], "requirement": {"desc": "埃利亚斯睡好一晚，次晨能工作", "conditions": {}, "tags": {"sleep": 0.8}, "forbiddenEffects": {}}, "kind": "order", "selfIntro": "来信人：埃利亚斯·沃德", "reward": {"currency": 100}, "senderId": "npc_passerby_a", "directRuleSetId": "rules_pa_01", "attachments": {}}, "view": {"spans": [{"spanId": "body:1", "kind": "word", "canCut": false, "text": "困", "wordId": "word_candidate_elias_sleep_alt", "cut": true}, {"spanId": "body:2", "kind": "word", "canCut": true, "text": "合上眼", "wordId": "word_candidate_elias_sleep", "cut": false}, {"spanId": "body:3", "kind": "word", "canCut": true, "text": "帮忙", "wordId": "word_candidate_elias_trust", "cut": false}, {"spanId": "body:4", "kind": "word", "canCut": true, "text": "没好意思", "wordId": "word_candidate_elias_fear", "cut": false}, {"spanId": "body:5", "kind": "word", "canCut": true, "text": "神志不清", "wordId": "word_candidate_e01_c1", "cut": false}, {"spanId": "body:6", "kind": "word", "canCut": true 上，腿一软差点把货砸了。隔壁的汉克伸手{{帮忙}}顶了一把，还以为是我肩膀的旧伤又发作，问我是不是该歇歇。我{{没好意思}}跟他说，我是因为困得{{神志不清}}，连脚下有块水渍都没瞧见，只能顺着他的话含糊应了一声。要是因为箱子搬不稳，工头少{{算}}我几铜板就不好了。\n\n妹妹在面包坊帮工，每天天不亮就走，晚上回来时身上带着一股甜面粉的焦香味。她总把没人要的面包边带回来吃。我知道她想省下钱买新鞋，她那双鞋底都磨透了，一下雨就往里渗水。昨晚我俩围着火炉烤脚，她把鞋垫抽出来贴在铁罩子上，刺啦一声冒出一股水汽，她自己反倒先{{乐了}}。我也想笑，可笑完又觉得心酸。要是我这阵子能多搬几趟重货，早就够给她换双像样的麂皮鞋了。\n\n昨晚迷迷糊糊{{梦见}}母亲了。她还是坐在旧桌子旁，就着油灯缝我那件破棉袄，嘴里轻声哼着小时候哄我睡觉的歌调子，针脚又密又齐。梦里我靠在她腿边，听着哼唱声和灯芯偶尔劈啪的那一声，心里特别踏实，真想就这么一直睡下去，永远别醒。可睁开眼，屋里只有冷冰冰的墙，还有墙缝里渗进来的海风。我也想把这些旧事都{{忘记}}，省得醒来心里空落落的，可真要是连这样的梦都没了，又舍不得。\n\n我只希望哪天能安安静静地过一晚上，让我踏踏实实睡觉，第二天起来还有力气干活。\n\n埃利亚斯·沃德\n\n灰港铁锚巷12号 二楼", "cutWordIds": ["word_candidate_elias_sleep_alt", "word_candidate_elias_sleep", "word_candidate_elias_trust", "word_candidate_elias_fear", "word_candidate_e01_c1", "word_candidate_elias_reason", "word_candidate_elias_happy", "word_candidate_elias_dream", "word_candidate_elias_forget"], "requirement": {"desc": "埃利亚斯睡好一晚，次晨能工作", "conditions": {}, "tags": {"sleep": 0.8}, "forbiddenEffects": {}}, "kind": "order", "selfIntro": "来信人：埃利亚斯·沃德", "reward": {"currency": 100}, "senderId": "npc_passerby_a", "directRuleSetId": "rules_pa_01", "attachments": {}}, "view": {"spans": [{"spanId": "body:1", "kind": "word", "canCut": false, "text": "困", "wordId": "word_candidate_elias_sleep_alt", "cut": true}, {"spanId": "body:2", "kind": "word", "canCut": true, "text": "合上眼", "wordId": "word_candidate_elias_sleep", "cut": false}, {"spanId": "body:3", "kind": "word", "canCut": true, "text": "帮忙", "wordId": "word_candidate_elias_trust", "cut": false}, {"spanId": "body:4", "kind": "word", "canCut": true, "text": "没好意思", "wordId": "word_candidate_elias_fear", "cut": false}, {"spanId": "body:5", "kind": "word", "canCut": true, "text": "神志不清", "wordId": "word_candidate_e01_c1", "cut": false}, {"spanId": "body:6", "kind": "word", "canCut": true, "text": "算", "wordId": "word_candidate_elias_reason", "cut": false}, {"spanId": "body:7", "kind": "word", "canCut": true, "text": "乐了", "wordId": "word_candidate_elias_happy", "cut": false}, { Id": "body:8", "h": 37.2, "cut": false, "y": 781.2000000000003, "text": "梦见", "w": 54.0, "x": 144.0}, {"spanId": false, "h": 37.2, "cut": false, "y": 781.2000000000003, "text": "母亲了。她还是坐在旧桌子旁，就着油", "w": 408.0, "x": 198.0}, {"spanId": false, "h": 37.2, "cut": false, "y": 818.4000000000003, "text": "灯缝我那件破棉袄，嘴里轻声哼着小时候哄我睡觉的歌调", "w": 600.0, "x": 0}, {"spanId": false, "h": 37.2, "cut": false, "y": 855.6000000000004, "text": "子，针脚又密又齐。梦里我靠在她腿边，听着哼唱声和灯", "w": 600.0, "x": 0}, {"spanId": false, "h": 37.2, "cut": false, "y": 892.8000000000004, "text": "芯偶尔劈啪的那一声，心里特别踏实，真想就这么一直睡", "w": 600.0, "x": 0}, {"spanId": false, "h": 37.2, "cut": false, "y": 930.0000000000005, "text": "下去，永远别醒。可睁开眼，屋里只有冷冰冰的墙，还有", "w": 600.0, "x": 0}, {"spanId": false, "h": 37.2, "cut": false, "y": 967.2000000000005, "text": "墙缝里渗进来的海风。我也想把这些旧事都", "w": 456.0, "x": 0}, {"spanId": "body:9", "h": 37.2, "cut": false, "y": 967.2000000000005, "text": "忘记", "w": 54.0, "x": 456.0}, {"spanId": false, "h": 37.2, "cut": false, "y": 967.2000000000005, "text": "，省得醒", "w": 96.0, "x": 510.0}, {"spanId": false, "h": 37.2, "cut": false, "y": 1004.4000000000005, "text": "来心里空落落的，可真要是连这样的梦都没了，又舍不得", "w": 600.0, "x": 0}, {"spanId": false, "h": 37.2, "cut": false, "y": 1041.6000000000006, "text": "。", "w": 24.0, "x": 0}, {"spanId": false, "h": 37.2, "cut": false, "y": 1116.0000000000007, "text": "我只希望哪天能安安静静地过一晚上，让我踏踏实实睡觉", "w": 600.0, "x": 0}, {"spanId": false, "h": 37.2, "cut": false, "y": 1153.2000000000007, "text": "，第二天起来还有力气干活。", "w": 312.0, "x": 0}, {"spanId": false, "h": 37.2, "cut": false, "y": 1227.6000000000008, "text": "埃利亚斯·沃德", "w": 152.0, "x": 0}, {"spanId": false, "h": 37.2, "cut": false, "y": 1302.000000000001, "text": "灰港铁锚巷12号 二楼", "w": 228.0, "x": 0}], "height": 1339.200000000001}, "frame": {"y": 10.799999999999999, "h": 338.4, "w": 736.0, "x": 32.0}, "clip": {"y": 92.8, "h": 188.39999999999998, "w": 672.0, "x": 64.0}, "paper": {"y": 202.8, "h": 1347.200000000001, "w": 630.0, "x": 82.0}, "holes": [{"y": 357.6, "h": 32.2, "w": 30.0, "x": 350.0}], "pose": null, "fontSize": 24.0, "lineHeight": 37.2}, {"width": 800, "height": 360, "label": "snip", "definition": {"title": "铁锚巷的一夜", "id": "letter_pa_01", "cuttable": true, "appearCondition": {"dayMin": 1}, "address": "灰港铁锚巷12号 二楼", "followupTemplateId": "tpl_pa_01", "ratingSetId": "rating_pa_01", "bottleType": "normal", "body": "我叫埃利亚斯·沃德，在灰港码头搬了十几年货。我和在面包坊帮工的妹妹合住铁锚巷，靠两份工钱付房租和饭钱。\n\n这阵子实在很累，脑子里像塞了团湿棉花，沉得抬不起头。白天站在码头边，明明{{困}}得眼皮直打架，{{合上眼}}又全是杂乱的动静：浪头撞在栈桥上的响声、绳索绷紧的吱呀声，还有同伴喊数字的粗嗓门。今天扛箱子走到斜坡上，腿一软差点把货砸了。隔壁的汉克伸手{{帮忙}}顶了一把，还以为是我肩膀的旧伤又发作，问我是不是该歇歇。我{{没好意思}}跟他说，我是因为困得{{神志不清}}，连脚下有块水渍都没瞧见，只能顺着他的话含糊应了一声。要是因为箱子搬不稳，工头少{{算}}我几铜板就不好了。\n\n妹妹在面包坊帮工，每天天不亮就走，晚上回来时身上带着一股甜面粉的焦香味。她总把没人要的面包边带回来吃。我知道她想省下钱买新鞋，她那双鞋底都磨透了，一下雨就往里渗水。昨晚我俩围着火炉烤脚，她把鞋垫抽出来贴在铁罩子上，刺啦一声冒出一股水汽，她自己反倒先{{乐了}}。我也想笑，可笑完又觉得心酸。要是我这阵子能多搬几趟重货，早就够给她换双像样的麂皮鞋了。\n\n昨晚迷迷糊糊{{梦见}}母亲了。她还是坐在旧桌子旁，就着油灯缝我那件破棉袄，嘴里轻声哼着小时候哄我睡觉的歌调子，针脚又密又齐。梦里我靠在她腿边，听着哼唱声和灯芯偶尔劈啪的那一声，心里特别踏实，真想就这么一直睡下去，永远别醒。可睁开眼，屋里只有冷冰冰的墙，还有墙缝里渗进来的海风。我也想把这些旧事都{{忘记}}，省得醒来心里空落落的，可真要是连这样的梦都没了，又舍不得。\n\n我只希望哪天能安安静静地过一晚上，让我踏踏实实睡觉，第二天起来还有力气干活。\n\n埃利亚斯·沃德\n\n灰港铁锚巷12号 二楼", "cutWordIds": ["word_candidate_elias_sleep_alt", "word_candidate_elias_sleep", "word_candidate_elias_trust", "word_candidate_elias_fear", "word_candidate_e01_c1", "word_candidate_elias_reason", "word_candidate_elias_happy", "word_candidate_elias_dream", "word_candidate_elias_forget"], "requirement": {"desc": "埃利亚斯睡好一晚，次晨能工作", "conditions": {}, "tags": {"sleep": 0.8}, "forbiddenEffects": {}}, "kind": "order", "selfIntro": "来信人：埃利亚斯·沃德", "reward": {"currency": 100}, "senderId": "npc_passerby_a", "directRuleSetId": "rules_pa_01", "attachments": {}}, "view": {"spans": [{"spanId": "body:1", "kind": "word", "canCut": false, "text": "困", "wordId": "word_candidate_elias_sleep_alt", "cut": true}, {"spanId": "body:2", "kind": "word", "canCut": false, "text": "合上眼", "wordId": "word_candidate_elias_sleep", "cut": true}, {"spanId": "body:3", "kind": "word", "canCut": true, "text": "帮忙", "wordI }}得眼皮直打架，{{合上眼}}又全是杂乱的动静：浪头撞在栈桥上的响声、绳索绷紧的吱呀声，还有同伴喊数字的粗嗓门。今天扛箱子走到斜坡上，腿一软差点把货砸了。隔壁的汉克伸手{{帮忙}}顶了一把，还以为是我肩膀的旧伤又发作，问我是不是该歇歇。我{{没好意思}}跟他说，我是因为困得{{神志不清}}，连脚下有块水渍都没瞧见，只能顺着他的话含糊应了一声。要是因为箱子搬不稳，工头少{{算}}我几铜板就不好了。\n\n妹妹在面包坊帮工，每天天不亮就走，晚上回来时身上带着一股甜面粉的焦香味。她总把没人要的面包边带回来吃。我知道她想省下钱买新鞋，她那双鞋底都磨透了，一下雨就往里渗水。昨晚我俩围着火炉烤脚，她把鞋垫抽出来贴在铁罩子上，刺啦一声冒出一股水汽，她自己反倒先{{乐了}}。我也想笑，可笑完又觉得心酸。要是我这阵子能多搬几趟重货，早就够给她换双像样的麂皮鞋了。\n\n昨晚迷迷糊糊{{梦见}}母亲了。她还是坐在旧桌子旁，就着油灯缝我那件破棉袄，嘴里轻声哼着小时候哄我睡觉的歌调子，针脚又密又齐。梦里我靠在她腿边，听着哼唱声和灯芯偶尔劈啪的那一声，心里特别踏实，真想就这么一直睡下去，永远别醒。可睁开眼，屋里只有冷冰冰的墙，还有墙缝里渗进来的海风。我也想把这些旧事都{{忘记}}，省得醒来心里空落落的，可真要是连这样的梦都没了，又舍不得。\n\n我只希望哪天能安安静静地过一晚上，让我踏踏实实睡觉，第二天起来还有力气干活。\n\n埃利亚斯·沃德\n\n灰港铁锚巷12号 二楼", "cutWordIds": ["word_candidate_elias_sleep_alt", "word_candidate_elias_sleep", "word_candidate_elias_trust", "word_candidate_elias_fear", "word_candidate_e01_c1", "word_candidate_elias_reason", "word_candidate_elias_happy", "word_candidate_elias_dream", "word_candidate_elias_forget"], "requirement": {"desc": "埃利亚斯睡好一晚，次晨能工作", "conditions": {}, "tags": {"sleep": 0.8}, "forbiddenEffects": {}}, "kind": "order", "selfIntro": "来信人：埃利亚斯·沃德", "reward": {"currency": 100}, "senderId": "npc_passerby_a", "directRuleSetId": "rules_pa_01", "attachments": {}}, "view": {"spans": [{"spanId": "body:1", "kind": "word", "canCut": false, "text": "困", "wordId": "word_candidate_elias_sleep_alt", "cut": true}, {"spanId": "body:2", "kind": "word", "canCut": false, "text": "合上眼", "wordId": "word_candidate_elias_sleep", "cut": true}, {"spanId": "body:3", "kind": "word", "canCut": true, "text": "帮忙", "wordId": "word_candidate_elias_trust", "cut": false}, {"spanId": "body:4", "kind": "word", "canCut": true, "text": "没好意思", "wordId": "word_candidate_elias_fear", "cut": false}, {"spanId": "body:5", "kind": "word", "canCut": true, "text": "神志不清", "wordId": "word_candidate_e01_c1", "cut": false}, {"spanId": "body:6", "kind": "word", "canCut": true, "text": "算", "wordId": "word_candidate_elias_reason", "cut": false}, {"spanId": "body:7", "kind": "word", "canCut": true, "tex  781.2000000000003, "text": "昨晚迷迷糊糊", "w": 144.0, "x": 0}, {"spanId": "body:8", "h": 37.2, "cut": false, "y": 781.2000000000003, "text": "梦见", "w": 54.0, "x": 144.0}, {"spanId": false, "h": 37.2, "cut": false, "y": 781.2000000000003, "text": "母亲了。她还是坐在旧桌子旁，就着油", "w": 408.0, "x": 198.0}, {"spanId": false, "h": 37.2, "cut": false, "y": 818.4000000000003, "text": "灯缝我那件破棉袄，嘴里轻声哼着小时候哄我睡觉的歌调", "w": 600.0, "x": 0}, {"spanId": false, "h": 37.2, "cut": false, "y": 855.6000000000004, "text": "子，针脚又密又齐。梦里我靠在她腿边，听着哼唱声和灯", "w": 600.0, "x": 0}, {"spanId": false, "h": 37.2, "cut": false, "y": 892.8000000000004, "text": "芯偶尔劈啪的那一声，心里特别踏实，真想就这么一直睡", "w": 600.0, "x": 0}, {"spanId": false, "h": 37.2, "cut": false, "y": 930.0000000000005, "text": "下去，永远别醒。可睁开眼，屋里只有冷冰冰的墙，还有", "w": 600.0, "x": 0}, {"spanId": false, "h": 37.2, "cut": false, "y": 967.2000000000005, "text": "墙缝里渗进来的海风。我也想把这些旧事都", "w": 456.0, "x": 0}, {"spanId": "body:9", "h": 37.2, "cut": false, "y": 967.2000000000005, "text": "忘记", "w": 54.0, "x": 456.0}, {"spanId": false, "h": 37.2, "cut": false, "y": 967.2000000000005, "text": "，省得醒", "w": 96.0, "x": 510.0}, {"spanId": false, "h": 37.2, "cut": false, "y": 1004.4000000000005, "text": "来心里空落落的，可真要是连这样的梦都没了，又舍不得", "w": 600.0, "x": 0}, {"spanId": false, "h": 37.2, "cut": false, "y": 1041.6000000000006, "text": "。", "w": 24.0, "x": 0}, {"spanId": false, "h": 37.2, "cut": false, "y": 1116.0000000000007, "text": "我只希望哪天能安安静静地过一晚上，让我踏踏实实睡觉", "w": 600.0, "x": 0}, {"spanId": false, "h": 37.2, "cut": false, "y": 1153.2000000000007, "text": "，第二天起来还有力气干活。", "w": 312.0, "x": 0}, {"spanId": false, "h": 37.2, "cut": false, "y": 1227.6000000000008, "text": "埃利亚斯·沃德", "w": 152.0, "x": 0}, {"spanId": false, "h": 37.2, "cut": false, "y": 1302.000000000001, "text": "灰港铁锚巷12号 二楼", "w": 228.0, "x": 0}], "height": 1339.200000000001}, "frame": {"y": 10.799999999999999, "h": 338.4, "w": 736.0, "x": 32.0}, "clip": {"y": 92.8, "h": 188.39999999999998, "w": 672.0, "x": 64.0}, "paper": {"y": 202.8, "h": 1347.200000000001, "w": 630.0, "x": 82.0}, "holes": [{"y": 357.6, "h": 32.2, "w": 30.0, "x": 350.0}, {"y": 357.6, "h": 32.2, "w": 78.0, "x": 548.0}], "pose": null, "fontSize": 24.0, "lineHeight": 37.2}, {"width": 1280, "height": 720, "label": "before", "definition": {"title": "铁锚巷的一夜", "id": "letter_pa_01", "cuttable": true, "appearCondition": {"dayMin": 1}, "address": "灰港铁锚巷12号 二楼", "followupTemplateId": "tpl_pa_01", "ratingSetId": "rating_pa_01", "bottleType": "normal", "body": "我叫埃利亚斯·沃德，在灰港码头搬了十几年货。我和在面包坊帮工的妹妹合住铁锚巷，靠两份工钱付房租和饭钱。\n\n这阵子实在很累，脑子里像塞了团湿棉花，沉得抬不起头。白天站在码头边，明明{{困}}得眼皮直打架，{{合上眼}}又全是杂乱的动静：浪头撞在栈桥上的响声、绳索绷紧的吱呀声，还有同伴喊数字的粗嗓门。今天扛箱子走到斜坡上，腿一软差点把货砸了。隔壁的汉克伸手{{帮忙}}顶了一把，还以为是我肩膀的旧伤又发作，问我是不是该歇歇。我{{没好意思}}跟他说，我是因为困得{{神志不清}}，连脚下有块水渍都没瞧见，只能顺着他的话含糊应了一声。要是因为箱子搬不稳，工头少{{算}}我几铜板就不好了。\n\n妹妹在面包坊帮工，每天天不亮就走，晚上回来时身上带着一股甜面粉的焦香味。她总把没人要的面包边带回来吃。我知道她想省下钱买新鞋，她那双鞋底都磨透了，一下雨就往里渗水。昨晚我俩围着火炉烤脚，她把鞋垫抽出来贴在铁罩子上，刺啦一声冒出一股水汽，她自己反倒先{{乐了}}。我也想笑，可笑完又觉得心酸。要是我这阵子能多搬几趟重货，早就够给她换双像样的麂皮鞋了。\n\n昨晚迷迷糊糊{{梦见}}母亲了。她还是坐在旧桌子旁，就着油灯缝我那件破棉袄，嘴里轻声哼着小时候哄我睡觉的歌调子，针脚又密又齐。梦里我靠在她腿边，听着哼唱声和灯芯偶尔劈啪的那一声，心里特别踏实，真想就这么一直睡下去，永远别醒。可睁开眼，屋里只有冷冰冰的墙，还有墙缝里渗进来的海风。我也想把这些旧事都{{忘记}}，省得醒来心里空落落的，可真要是连这样的梦都没了，又舍不得。\n\n我只希望哪天能安安静静地过一晚上，让我踏踏实实睡觉，第二天起来还有力气干活。\n\n埃利亚斯·沃德\n\n灰港铁锚巷12号 二楼", "cutWordIds": ["word_candidate_elias_sleep_alt", "word_candidate_elias_sleep", "word_candidate_elias_trust", "word_candidate_elias_fear", "word_candidate_e01_c1", "word_candidate_elias_reason", "word_candidate_elias_happy", "word_candidate_elias_dream", "word_candidate_elias_forget"], "requirement": {"desc": "埃利亚斯睡好一晚，次晨能工作", "conditions": {}, "tags": {"sleep": 0.8}, "forbiddenEffects": {}}, "kind": "order", "selfIntro": "来信人：埃利亚斯·沃德", "reward": {"currency": 100}, "senderId": "npc_passerby_a", "directRuleSetId": "rules_pa_01", "attachments": {}}, "view": {"spans": [{"spanId": "body:1", "kind": "word", "canCut": false, "text": "困", "wordId": "word_candidate_elias_sleep_alt", "cut": true}, {"spanId": "body:2", "kind": "word", "canCut": false, "text": "合上眼", "wordId": " \n\n这阵子实在很累，脑子里像塞了团湿棉花，沉得抬不起头。白天站在码头边，明明{{困}}得眼皮直打架，{{合上眼}}又全是杂乱的动静：浪头撞在栈桥上的响声、绳索绷紧的吱呀声，还有同伴喊数字的粗嗓门。今天扛箱子走到斜坡上，腿一软差点把货砸了。隔壁的汉克伸手{{帮忙}}顶了一把，还以为是我肩膀的旧伤又发作，问我是不是该歇歇。我{{没好意思}}跟他说，我是因为困得{{神志不清}}，连脚下有块水渍都没瞧见，只能顺着他的话含糊应了一声。要是因为箱子搬不稳，工头少{{算}}我几铜板就不好了。\n\n妹妹在面包坊帮工，每天天不亮就走，晚上回来时身上带着一股甜面粉的焦香味。她总把没人要的面包边带回来吃。我知道她想省下钱买新鞋，她那双鞋底都磨透了，一下雨就往里渗水。昨晚我俩围着火炉烤脚，她把鞋垫抽出来贴在铁罩子上，刺啦一声冒出一股水汽，她自己反倒先{{乐了}}。我也想笑，可笑完又觉得心酸。要是我这阵子能多搬几趟重货，早就够给她换双像样的麂皮鞋了。\n\n昨晚迷迷糊糊{{梦见}}母亲了。她还是坐在旧桌子旁，就着油灯缝我那件破棉袄，嘴里轻声哼着小时候哄我睡觉的歌调子，针脚又密又齐。梦里我靠在她腿边，听着哼唱声和灯芯偶尔劈啪的那一声，心里特别踏实，真想就这么一直睡下去，永远别醒。可睁开眼，屋里只有冷冰冰的墙，还有墙缝里渗进来的海风。我也想把这些旧事都{{忘记}}，省得醒来心里空落落的，可真要是连这样的梦都没了，又舍不得。\n\n我只希望哪天能安安静静地过一晚上，让我踏踏实实睡觉，第二天起来还有力气干活。\n\n埃利亚斯·沃德\n\n灰港铁锚巷12号 二楼", "cutWordIds": ["word_candidate_elias_sleep_alt", "word_candidate_elias_sleep", "word_candidate_elias_trust", "word_candidate_elias_fear", "word_candidate_e01_c1", "word_candidate_elias_reason", "word_candidate_elias_happy", "word_candidate_elias_dream", "word_candidate_elias_forget"], "requirement": {"desc": "埃利亚斯睡好一晚，次晨能工作", "conditions": {}, "tags": {"sleep": 0.8}, "forbiddenEffects": {}}, "kind": "order", "selfIntro": "来信人：埃利亚斯·沃德", "reward": {"currency": 100}, "senderId": "npc_passerby_a", "directRuleSetId": "rules_pa_01", "attachments": {}}, "view": {"spans": [{"spanId": "body:1", "kind": "word", "canCut": false, "text": "困", "wordId": "word_candidate_elias_sleep_alt", "cut": true}, {"spanId": "body:2", "kind": "word", "canCut": false, "text": "合上眼", "wordId": "word_candidate_elias_sleep", "cut": true}, {"spanId": "body:3", "kind": "word", "canCut": false, "text": "帮忙", "wordId": "word_candidate_elias_trust", "cut": true}, {"spanId": "body:4", "kind": "word", "canCut": true, "text": "没好意思", "wordId": "word_candidate_elias_fear", "cut": false}, {"spanId": "body:5", "kind": "word", "canCut": true, "text": "神志不清", "wordId": "word_candidate_e01_c1", "cut": false}, {"spanId": "body:6", "kind": "word", "canCut": true, "text": "算", "wordId": "word_candidate_elias_reason", "cut": false}, {"spanId": "bo panId": false, "h": 37.2, "cut": false, "y": 706.8000000000002, "text": "我只希望哪天能安安静静地过一晚上，让我踏踏实实睡觉，第二天起来还有力气干活。", "w": 912.0, "x": 0}, {"spanId": false, "h": 37.2, "cut": false, "y": 781.2000000000003, "text": "埃利亚斯·沃德", "w": 152.0, "x": 0}, {"spanId": false, "h": 37.2, "cut": false, "y": 855.6000000000004, "text": "灰港铁锚巷12号 二楼", "w": 228.0, "x": 0}], "height": 892.8000000000004}, "frame": {"y": 21.599999999999998, "h": 676.8, "w": 1177.6000000000001, "x": 51.2}, "clip": {"y": 103.6, "h": 526.8, "w": 1113.6000000000001, "x": 83.2}, "paper": {"y": 213.6, "h": 900.8000000000004, "w": 1071.6000000000001, "x": 101.2}, "holes": [{"y": 331.2, "h": 32.2, "w": 30.0, "x": 969.2}, {"y": 368.4, "h": 32.2, "w": 78.0, "x": 105.2}, {"y": 405.6, "h": 32.2, "w": 54.0, "x": 777.2}], "pose": {"spanId": "body:3", "phase": "fly", "w": 54.0, "x": 829.4106248727866, "scale": 0.9740331772847547, "snip": 1.5625, "angle": -0.06726622799246676, "opacity": 1, "text": "帮忙", "h": 37.2, "y": 421.4816060753816}, "fontSize": 24.0, "lineHeight": 37.2}, {"width": 1280, "height": 720, "label": "after", "definition": {"title": "铁锚巷的一夜", "id": "letter_pa_01", "cuttable": true, "appearCondition": {"dayMin": 1}, "address": "灰港铁锚巷12号 二楼", "followupTemplateId": "tpl_pa_01", "ratingSetId": "rating_pa_01", "bottleType": "normal", "body": "我叫埃利亚斯·沃德，在灰港码头搬了十几年货。我和在面包坊帮工的妹妹合住铁锚巷，靠两份工钱付房租和饭钱。\n\n这阵子实在很累，脑子里像塞了团湿棉花，沉得抬不起头。白天站在码头边，明明{{困}}得眼皮直打架，{{合上眼}}又全是杂乱的动静：浪头撞在栈桥上的响声、绳索绷紧的吱呀声，还有同伴喊数字的粗嗓门。今天扛箱子走到斜坡上，腿一软差点把货砸了。隔壁的汉克伸手{{帮忙}}顶了一把，还以为是我肩膀的旧伤又发作，问我是不是该歇歇。我{{没好意思}}跟他说，我是因为困得{{神志不清}}，连脚下有块水渍都没瞧见，只能顺着他的话含糊应了一声。要是因为箱子搬不稳，工头少{{算}}我几铜板就不好了。\n\n妹妹在面包坊帮工，每天天不亮就走，晚上回来时身上带着一股甜面粉的焦香味。她总把没人要的面包边带回来吃。我知道她想省下钱买新鞋，她那双鞋底都磨透了，一下雨就往里渗水。昨晚我俩围着火炉烤脚，她把鞋垫抽出来贴在铁罩子上，刺啦一声冒出一股水汽，她自己反倒先{{乐了}}。我也想笑，可笑完又觉得心酸。要是我这阵子能多搬几趟重货，早就够给她换双像样的麂皮鞋了。\n\n昨晚迷迷糊糊{{梦见}}母亲了。她还是坐在旧桌子旁，就着油灯缝我那件破棉袄，嘴里轻声哼着小时候哄我睡觉的歌调子，针脚又密又齐。梦里我靠在她腿边，听着哼唱声和灯芯偶尔劈啪的那一声，心里特别踏实，真想就这么一直睡下去，永远别醒。可睁开眼，屋里只有冷冰冰的墙，还有墙缝里渗进来的海风。我也想把这些旧事都{{忘记}}，省得醒来心里空落落的，可真要是连这样的梦都没了，又舍不得。\n\n我只希望哪天能安安静静地过一晚上，让我踏踏实实睡觉，第二天起来还有力气干活。\n\n埃利亚斯·沃德\n\n灰港铁锚巷12号 二楼", "cutWordIds": ["word_candidate_elias_sleep_alt", "word_candidate_elias_sleep", "word_candidate_elias_trust", "word_candidate_elias_fear", "word_candidate_e01_c1", "word_candidate_elias_reason", "word_candidate_elias_happy", "word_candidate_elias_dream", "word_candidate_elias_forget"], "requirement": {"desc": "埃利亚斯睡好一晚，次晨能工作", "conditions": {}, "tags": {"sleep": 0.8}, "forbiddenEffects": {}}, "kind": "order", "selfIntro": "来信人：埃利亚斯·沃德", "reward": {"currency": 100}, "senderId": "npc_passerby_a", "directRuleSetId": "rules_pa_01", "attachments": {}}, "view": {"spans": [{"spanId": "body:1", "kind": "word", "canCut": false, "text": "困", "wordId": "word_candidate_elias_sleep_alt", "cut": true}, {"spanId": "body:2", "kind": "word", "canCut": false, "text": "合上眼", "wordId": "word_candidate_elias_sleep", "cut": true}, {"spanId": "body:3", "kind": "word", "canCut": false, "text": "帮忙", "wordId": "word_candidate_elias_trust", "cut": true}, {"spanId": "body:4", "kind": "word", "canCut": true, "text": "没好意思", "wordId": "word_candidate_elias_fear", "cut": false}, {"spanId": "body:5", "kind": "word", "canCut": true, "text": "神志不清", "wordId": "word_candidate_e01_c1", "cut": false}, {"spanId": "body:6", "kind": "word", "canCut": true, "text": "算", "wordId": "word_candidate_elias_reason", "cut": false}, {"spanId": "body:7", "kind": "word", "canCut": true, "text": "乐了", "wordId": "word_candidate_elias_happy", "cut": false}, {"spanId": "body:8", "kind": "word", "canCut": true, "text": "梦见", "wordId": "word_candidate_elias_dream", "cut": false}, {"spanId": "body:9", "kind": "word", "canCut": true, "text": "忘记", "wordId": "word_candidate_elias_forget", "cut": false}], "letterId": "letter_pa_01", "kind": "order", "cuttable": true, "selfIntro": "来信人：埃利亚斯·沃德", "address": "灰港铁锚巷12号 二楼", "claimedAttachmentIds": {}, "instanceId": "letter:letter_pa_01", "received": true, "read": true, "segments": [{"text": "我叫埃利亚斯·沃德，在灰港码头搬了十几年货。我和在面包坊帮工的妹妹合住铁锚巷，靠  855.6000000000004, "text": "灰港铁锚巷12号 二楼", "w": 228.0, "x": 0}], "height": 892.8000000000004}, "frame": {"y": 21.599999999999998, "h": 676.8, "w": 1177.6000000000001, "x": 51.2}, "clip": {"y": 103.6, "h": 526.8, "w": 1113.6000000000001, "x": 83.2}, "paper": {"y": 213.6, "h": 900.8000000000004, "w": 1071.6000000000001, "x": 101.2}, "holes": [{"y": 331.2, "h": 32.2, "w": 30.0, "x": 969.2}, {"y": 368.4, "h": 32.2, "w": 78.0, "x": 105.2}, {"y": 405.6, "h": 32.2, "w": 54.0, "x": 777.2}], "pose": null, "fontSize": 24.0, "lineHeight": 37.2}, {"width": 1024, "height": 768, "label": "before", "definition": {"title": "铁锚巷的一夜", "id": "letter_pa_01", "cuttable": true, "appearCondition": {"dayMin": 1}, "address": "灰港铁锚巷12号 二楼", "followupTemplateId": "tpl_pa_01", "ratingSetId": "rating_pa_01", "bottleType": "normal", "body": "我叫埃利亚斯·沃德，在灰港码头搬了十几年货。我和在面包坊帮工的妹妹合住铁锚巷，靠两份工钱付房租和饭钱。\n\n这阵子实在很累，脑子里像塞了团湿棉花，沉得抬不起头。白天站在码头边，明明{{困}}得眼皮直打架，{{合上眼}}又全是杂乱的动静：浪头撞在栈桥上的响声、绳索绷紧的吱呀声，还有同伴喊数字的粗嗓门。今天扛箱子走到斜坡上，腿一软差点把货砸了。隔壁的汉克伸手{{帮忙}}顶了一把，还以为是我肩膀的旧伤又发作，问我是不是该歇歇。我{{没好意思}}跟他说，我是因为困得{{神志不清}}，连脚下有块水渍都没瞧见，只能顺着他的话含糊应了一声。要是因为箱子搬不稳，工头少{{算}}我几铜板就不好了。\n\n妹妹在面包坊帮工，每天天不亮就走，晚上回来时身上带着一股甜面粉的焦香味。她总把没人要的面包边带回来吃。我知道她想省下钱买新鞋，她那双鞋底都磨透了，一下雨就往里渗水。昨晚我俩围着火炉烤脚，她把鞋垫抽出来贴在铁罩子上，刺啦一声冒出一股水汽，她自己反倒先{{乐了}}。我也想笑，可笑完又觉得心酸。要是我这阵子能多搬几趟重货，早就够给她换双像样的麂皮鞋了。\n\n昨晚迷迷糊糊{{梦见}}母亲了。她还是坐在旧桌子旁，就着油灯缝我那件破棉袄，嘴里轻声哼着小时候哄我睡觉的歌调子，针脚又密又齐。梦里我靠在她腿边，听着哼唱声和灯芯偶尔劈啪的那一声，心里特别踏实，真想就这么一直睡下去，永远别醒。可睁开眼，屋里只有冷冰冰的墙，还有墙缝里渗进来的海风。我也想把这些旧事都{{忘记}}，省得醒来心里空落落的，可真要是连这样的梦都没了，又舍不得。\n\n我只希望哪天能安安静静地过一晚上，让我踏踏实实睡觉，第二天起来还有力气干活。\n\n埃利亚斯·沃德\n\n灰港铁锚巷12号 二楼", "cutWordIds": ["word_candidate_elias_sleep_alt", "word_candidate_elias_sleep", "word_candidate_elias_trust", "word_candidate_elias_fear", "word_candidate_e01_c1", "word_candidate_elias_reason", "word_candidate_elias_happy", "word_candidate_elias_dream", "word_candidate_elias_forget"], "requirement": {"desc": "埃利亚斯睡好一晚，次晨能工作", "conditions": {}, "tags": {"sleep": 0.8}, "forbiddenEffects": {}}, "kind": "order", "selfIntro": "来信人：埃利亚斯·沃德", "rewa 00005, "text": "气干活。", "w": 96.0, "x": 0}, {"spanId": false, "h": 37.2, "cut": false, "y": 1004.4000000000005, "text": "埃利亚斯·沃德", "w": 152.0, "x": 0}, {"spanId": false, "h": 37.2, "cut": false, "y": 1078.8000000000006, "text": "灰港铁锚巷12号 二楼", "w": 228.0, "x": 0}], "height": 1116.0000000000007}, "frame": {"y": 23.04, "h": 721.92, "w": 942.08, "x": 40.96}, "clip": {"y": 105.03999999999999, "h": 571.92, "w": 878.08, "x": 72.96000000000001}, "paper": {"y": 215.04, "h": 1124.0000000000007, "w": 836.08, "x": 90.96000000000001}, "holes": [{"y": 369.84000000000003, "h": 32.2, "w": 30.0, "x": 142.96}, {"y": 369.84000000000003, "h": 32.2, "w": 78.0, "x": 340.96000000000004}, {"y": 444.24, "h": 32.2, "w": 54.0, "x": 430.96000000000004}], "pose": null, "fontSize": 24.0, "lineHeight": 37.2}, {"width": 1024, "height": 768, "label": "snip", "definition": {"title": "铁锚巷的一夜", "id": "letter_pa_01", "cuttable": true, "appearCondition": {"dayMin": 1}, "address": "灰港铁锚巷12号 二楼", "followupTemplateId": "tpl_pa_01", "ratingSetId": "rating_pa_01", "bottleType": "normal", "body": "我叫埃利亚斯·沃德，在灰港码头搬了十几年货。我和在面包坊帮工的妹妹合住铁锚巷，靠两份工钱付房租和饭钱。\n\n这阵子实在很累，脑子里像塞了团湿棉花，沉得抬不起头。白天站在码头边，明明{{困}}得眼皮直打架，{{合上眼}}又全是杂乱的动静：浪头撞在栈桥上的响声、绳索绷紧的吱呀声，还有同伴喊数字的粗嗓门。今天扛箱子走到斜坡上，腿一软差点把货砸了。隔壁的汉克伸手{{帮忙}}顶了一把，还以为是我肩膀的旧伤又发作，问我是不是该歇歇。我{{没好意思}}跟他说，我是因为困得{{神志不清}}，连脚下有块水渍都没瞧见，只能顺着他的话含糊应了一声。要是因为箱子搬不稳，工头少{{算}}我几铜板就不好了。\n\n妹妹在面包坊帮工，每天天不亮就走，晚上回来时身上带着一股甜面粉的焦香味。她总把没人要的面包边带回来吃。我知道她想省下钱买新鞋，她那双鞋底都磨透了，一下雨就往里渗水。昨晚我俩围着火炉烤脚，她把鞋垫抽出来贴在铁罩子上，刺啦一声冒出一股水汽，她自己反倒先{{乐了}}。我也想笑，可笑完又觉得心酸。要是我这阵子能多搬几趟重货，早就够给她换双像样的麂皮鞋了。\n\n昨晚迷迷糊糊{{梦见}}母亲了。她还是坐在旧桌子旁，就着油灯缝我那件破棉袄，嘴里轻声哼着小时候哄我睡觉的歌调子，针脚又密又齐。梦里我靠在她腿边，听着哼唱声和灯芯偶尔劈啪的那一声，心里特别踏实，真想就这么一直睡下去，永远别醒。可睁开眼，屋里只有冷冰冰的墙，还有墙缝里渗进来的海风。我也想把这些旧事都{{忘记}}，省得醒来心里空落落的，可真要是连这样的梦都没了，又舍不得。\n\n我只希望哪天能安安静静地过一晚上，让我踏踏实实睡觉，第二天起来还有力气干活。\n\n埃利亚斯·沃德\n\n灰港铁锚巷12号 二楼", "cutWordIds": ["word_candidate_elias_sleep_alt", "word_candidate_elias_sleep", "word_candidate_elias_trust", "word_candidate_elias_fear", "word_candidate_e01_c1", "word_candidate_elias_reason", "word ": 216.0, "x": 54.0}, {"spanId": false, "h": 37.2, "cut": false, "y": 409.19999999999993, "text": "妹妹在面包坊帮工，每天天不亮就走，晚上回来时身上带着一股甜面粉的焦香", "w": 816.0, "x": 0}, {"spanId": false, "h": 37.2, "cut": false, "y": 446.3999999999999, "text": "味。她总把没人要的面包边带回来吃。我知道她想省下钱买新鞋，她那双鞋底", "w": 816.0, "x": 0}, {"spanId": false, "h": 37.2, "cut": false, "y": 483.5999999999999, "text": "都磨透了，一下雨就往里渗水。昨晚我俩围着火炉烤脚，她把鞋垫抽出来贴在", "w": 816.0, "x": 0}, {"spanId": false, "h": 37.2, "cut": false, "y": 520.8, "text": "铁罩子上，刺啦一声冒出一股水汽，她自己反倒先", "w": 528.0, "x": 0}, {"spanId": "body:7", "h": 37.2, "cut": false, "y": 520.8, "text": "乐了", "w": 54.0, "x": 528.0}, {"spanId": false, "h": 37.2, "cut": false, "y": 520.8, "text": "。我也想笑，可笑完又", "w": 240.0, "x": 582.0}, {"spanId": false, "h": 37.2, "cut": false, "y": 558.0, "text": "觉得心酸。要是我这阵子能多搬几趟重货，早就够给她换双像样的麂皮鞋了。", "w": 816.0, "x": 0}, {"spanId": false, "h": 37.2, "cut": false, "y": 632.4000000000001, "text": "昨晚迷迷糊糊", "w": 144.0, "x": 0}, {"spanId": "body:8", "h": 37.2, "cut": false, "y": 632.4000000000001, "text": "梦见", "w": 54.0, "x": 144.0}, {"spanId": false, "h": 37.2, "cut": false, "y": 632.4000000000001, "text": "母亲了。她还是坐在旧桌子旁，就着油灯缝我那件破棉袄，", "w": 624.0, "x": 198.0}, {"spanId": false, "h": 37.2, "cut": false, "y": 669.6000000000001, "text": "嘴里轻声哼着小时候哄我睡觉的歌调子，针脚又密又齐。梦里我靠在她腿边，", "w": 816.0, "x": 0}, {"spanId": false, "h": 37.2, "cut": false, "y": 706.8000000000002, "text": "听着哼唱声和灯芯偶尔劈啪的那一声，心里特别踏实，真想就这么一直睡下去", "w": 816.0, "x": 0}, {"spanId": false, "h": 37.2, "cut": false, "y": 744.0000000000002, "text": "，永远别醒。可睁开眼，屋里只有冷冰冰的墙，还有墙缝里渗进来的海风。我", "w": 816.0, "x": 0}, {"spanId": false, "h": 37.2, "cut": false, "y": 781.2000000000003, "text": "也想把这些旧事都", "w": 192.0, "x": 0}, {"spanId": "body:9", "h": 37.2, "cut": false, "y": 781.2000000000003, "text": "忘记", "w": 54.0, "x": 192.0}, {"spanId": false, "h": 37.2, "cut": false, "y": 781.2000000000003, "text": "，省得醒来心里空落落的，可真要是连这样的梦都没了", "w": 576.0, "x": 246.0}, {"spanId": false, "h": 37.2, "cut": false, "y": 818.4000000000003, "text": "，又舍不得。", "w": 144.0, "x": 0}, {"spanId": false, "h": 37.2, "cut": false, "y": 892.8000000000004, "text": "我只希望哪天能安安静静地过一晚上，让我踏踏实实睡觉，第二天起来还有力", "w": 816.0, "x": 0}, {"spanId": false, "h": 37.2, "cut": false, "y": 930.0000000000005, "text": "气干活。", "w": 96.0, "x": 0}, {"spanId": false, "h": 37.2, "cut": false, "y": 1004.4000000000005, "text": "埃利亚斯·沃德", "w": 152.0, "x": 0}, {"spanId": false, "h": 37.2, "cut": false, "y": 1078.8000000000006, "text": "灰港铁锚巷12号 二楼", "w": 228.0, "x": 0}], "height": 1116.0000000000007}, "frame": {"y": 23.04, "h": 721.92, "w": 942.08, "x": 40.96}, "clip": {"y": 105.03999999999999, "h": 571.92, "w": 878.08, "x": 72.96000000000001}, "paper": {"y": 215.04, "h": 1124.0000000000007, "w": 836.08, "x": 90.96000000000001}, "holes": [{"y": 369.84000000000003, "h": 32.2, "w": 30.0, "x": 142.96}, {"y": 369.84000000000003, "h": 32.2, "w": 78.0, "x": 340.96000000000004}, {"y": 444.24, "h": 32.2, "w": 54.0, "x": 430.96000000000004}, {"y": 481.43999999999994, "h": 32.2, "w": 102.0, "x": 358.96000000000004}], "pose": {"spanId": "body:4", "phase": "snip", "w": 102.0, "x": 358.96000000000004, "scale": 1.0, "snip": 0.5625, "angle": -0.0, "opacity": 1, "text": "没好意思", "h": 37.2, "y": 479.43999999999994}, "fontSize": 24.0, "lineHeight": 37.2}, {"width": 1024, "height": 768, "label": "flight", "definition": {"title": "铁锚巷的一夜", "id": "letter_pa_01", "cuttable": true, "appearCondition": {"dayMin": 1}, "address": "灰港铁锚巷12号 二楼", "followupTemplateId": "tpl_pa_01", "ratingSetId": "rating_pa_01", "bottleType": "normal", "body": "我叫埃利亚斯·沃德，在灰港码头搬了十几年货。我和在面包坊帮工的妹妹合住铁锚巷，靠两份工钱付房租和饭钱。\n\n这阵子实在很累，脑子里像塞了团湿棉花，沉得抬不起头。白天站在码头边，明明{{困}}得眼皮直打架，{{合上眼}}又全是杂乱的动静：浪头撞在栈桥上的响声、绳索绷紧的吱呀声，还有同伴喊数字的粗嗓门。今天扛箱子走到斜坡上，腿一软差点把货砸了。隔壁的汉克伸手{{帮忙}}顶了一把，还以为是我肩膀的旧伤又发作，问我是不是该歇歇。我{{没好意思}}跟他说，我是因为困得{{神志不清}}，连脚下有块水渍都没瞧见，只能顺着他的话含糊应了一声。要是因为箱子搬不稳，工头少{{算}}我几铜板就不好了。\n\n妹妹在面包坊帮工，每天天不亮就走，晚上回来时身上带着一股甜面粉的焦香味。她总把没人要的面包边带回来吃。我知道她想省下钱买新鞋，她那双鞋底都磨透了，一下雨就往里渗水。昨晚我俩围着火炉烤脚，她把鞋垫抽出来贴在铁罩子上，刺啦一声冒出一股水汽，她自己反倒先{{乐了}}。我也想笑，可笑完又觉得心酸。要是我这阵子能多搬几趟重货，早就够给她换双像样的麂皮鞋了。\n\n昨晚迷迷糊糊{{梦见}}母亲了。她还是坐在旧桌子旁，就着油灯缝我那件破棉袄，嘴里轻声哼着小时候哄我睡觉的歌调子，针脚又密又齐。梦里我靠在她腿边，听着哼唱声和灯芯偶尔劈啪的那一声，心里特别踏实，真想就这么一直睡下去，永远别醒。可睁开眼，屋里只有冷冰冰的墙，还有墙缝里渗进来的海风。我也想把这些旧事都{{忘记}}，省得醒来心里空落落的，可真要是连这样的梦都没了，又舍不得。\n\n我只希望哪天能安安静静地过一晚上，让我踏踏实实睡觉，第二天起来还有力气干活。\n\n埃利亚斯·沃德\n\n灰港铁锚巷12号 二楼", "cutWordIds": ["word_candidate_elias_sleep_alt", "word_candidate_elias_sleep", "word_candidate_elias_trust", "word_candidate_elias_fear", "word_candidate_e01_c1", "word_candidate_elias_reason", "word_candidate_elias_happy", "word_candidate_elias_dream", "word_candidate_elias_forget"], "requirement": {"desc": "埃利亚斯睡好一晚，次晨能工作", "conditions": {}, "tags": {"sleep": 0.8}, "forbiddenEffects": {}}, "kind": "order", "selfIntro": "来信人：埃利亚斯·沃德", "reward": {"currency": 100}, "senderId": "npc_passerby_a", "directRuleSetId": "rules_pa_01", "attachments": {}}, "view": {"spans": [{"spanId": "body:1", "kind": "word", "canCut": false, "text": "困", "wordId": "word_candidate_elias_sleep_alt", "cut": true}, {"spanId": "body:2", "kind": "word", "canCut": false, "text": "合上眼", "wordId": "word_candidate_elias_sleep", "cut": true}, {"spanId": "body:3", "kind": "word", "canCut": false, "text": "帮忙", "wordId": "word_candidate_elias_trust", "cut": true}, {"spanId": "body:4", "kind": "word", "canCut": false, "text": "没好意思", "wordId": "word_candidate_elias_fear", "cut": true}, {"spanId": "body:5", "kind": "word", "canCut": true, "text": "神志不清", "wordId": "word_candidate_e01_c1", "cut": false}, {"spanId": "body:6", "kind": "word", "canCut": true, "text": "算", "wordId": "word_candidate_elias_reason", "cut": false}, {"spanId": "body:7", "kind": "word", "canCut": true, "text": "乐了", "wordId": "word_candidate_elias_happy", "cut": false}, {"spanId": "body:8", "kind": "word", "canCut": true, "text": "梦见", "wordId": "word_candidate_elias_dream", "cut": false}, {"spanId": "body:9", "kind": "word", "canCut": true, "text": "忘记", "wordId": "word_candidate_elias_forget", "cut": false}], "letterId": "letter_pa 楼", "followupTemplateId": "tpl_pa_01", "ratingSetId": "rating_pa_01", "bottleType": "normal", "body": "我叫埃利亚斯·沃德，在灰港码头搬了十几年货。我和在面包坊帮工的妹妹合住铁锚巷，靠两份工钱付房租和饭钱。\n\n这阵子实在很累，脑子里像塞了团湿棉花，沉得抬不起头。白天站在码头边，明明{{困}}得眼皮直打架，{{合上眼}}又全是杂乱的动静：浪头撞在栈桥上的响声、绳索绷紧的吱呀声，还有同伴喊数字的粗嗓门。今天扛箱子走到斜坡上，腿一软差点把货砸了。隔壁的汉克伸手{{帮忙}}顶了一把，还以为是我肩膀的旧伤又发作，问我是不是该歇歇。我{{没好意思}}跟他说，我是因为困得{{神志不清}}，连脚下有块水渍都没瞧见，只能顺着他的话含糊应了一声。要是因为箱子搬不稳，工头少{{算}}我几铜板就不好了。\n\n妹妹在面包坊帮工，每天天不亮就走，晚上回来时身上带着一股甜面粉的焦香味。她总把没人要的面包边带回来吃。我知道她想省下钱买新鞋，她那双鞋底都磨透了，一下雨就往里渗水。昨晚我俩围着火炉烤脚，她把鞋垫抽出来贴在铁罩子上，刺啦一声冒出一股水汽，她自己反倒先{{乐了}}。我也想笑，可笑完又觉得心酸。要是我这阵子能多搬几趟重货，早就够给她换双像样的麂皮鞋了。\n\n昨晚迷迷糊糊{{梦见}}母亲了。她还是坐在旧桌子旁，就着油灯缝我那件破棉袄，嘴里轻声哼着小时候哄我睡觉的歌调子，针脚又密又齐。梦里我靠在她腿边，听着哼唱声和灯芯偶尔劈啪的那一声，心里特别踏实，真想就这么一直睡下去，永远别醒。可睁开眼，屋里只有冷冰冰的墙，还有墙缝里渗进来的海风。我也想把这些旧事都{{忘记}}，省得醒来心里空落落的，可真要是连这样的梦都没了，又舍不得。\n\n我只希望哪天能安安静静地过一晚上，让我踏踏实实睡觉，第二天起来还有力气干活。\n\n埃利亚斯·沃德\n\n灰港铁锚巷12号 二楼", "cutWordIds": ["word_candidate_elias_sleep_alt", "word_candidate_elias_sleep", "word_candidate_elias_trust", "word_candidate_elias_fear", "word_candidate_e01_c1", "word_candidate_elias_reason", "word_candidate_elias_happy", "word_candidate_elias_dream", "word_candidate_elias_forget"], "requirement": {"desc": "埃利亚斯睡好一晚，次晨能工作", "conditions": {}, "tags": {"sleep": 0.8}, "forbiddenEffects": {}}, "kind": "order", "selfIntro": "来信人：埃利亚斯·沃德", "reward": {"currency": 100}, "senderId": "npc_passerby_a", "directRuleSetId": "rules_pa_01", "attachments": {}}, "view": {"spans": [{"spanId": "body:1", "kind": "word", "canCut": false, "text": "困", "wordId": "word_candidate_elias_sleep_alt", "cut": true}, {"spanId": "body:2", "kind": "word", "canCut": false, "text": "合上眼", "wordId": "word_candidate_elias_sleep", "cut": true}, {"spanId": "body:3", "kind": "word", "canCut": false, "text": "帮忙", "wordId": "word_candidate_elias_trust", "cut": true}, {"spanId": "body:4", "kind": "word", "canCut": false, "text": "没好意思", "wordId": "word_candidate_elias_fear", "cut": true}, {"spanId": "body:5", "kind": "word", "canCut": true, "text": "神志不清", "wordId": "word_candidate_e01_c1
